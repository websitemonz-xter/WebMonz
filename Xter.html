<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Opsi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { 
            /* BERHASIL DIGANTI MENGGUNAKAN TEMA GAMBAR ANDA */
            background: url('https://www.image2url.com/r2/default/videos/1782560105196-83c5e5dd-c5f3-408b-8a0c-757ed060ad1c.mp4') no-repeat center center fixed;
            background-size: cover;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Sedikit digelapkan biar teks putihnya makin menyala kontras */
            z-index: 1;
        }

        .container {
            width: 90%; max-width: 400px;
            padding: 25px;
            text-align: center;
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-top {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px; margin-bottom: 15px;
            border-radius: 15px;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none; color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .option-btn:last-of-type {
            margin-bottom: 0;
        }

        .option-btn:hover { background: rgba(255, 255, 255, 0.2); }
        
        .icon { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">

            <div class="icon" style="background: #25D366;"><i class="fa-brands fa-whatsapp"></i></div>
            <div style="text-align: left;">
                <h4 style="font-size: 16px;">Grup</h4>
                <p style="font-size: 12px; opacity: 0.8;">Link Grup</p>
            </div>
        </a>

        <!-- Opsi 3 -->
        <a href="https://youtu.be/9FAcmYG9sbk?si=GkM_wYusI2Vs7vwG" class="option-btn">
            <div class="icon" style="background: #FF0032;"><i class="fa-solid fa-play"></i></div>
            <div style="text-align: left;">
                <h4 style="font-size: 16px;">Video</h4>
                <p style="font-size: 12px; opacity: 0.8;">Video tutorial</p>
            </div>

</body>
</html>
