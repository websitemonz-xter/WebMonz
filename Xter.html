<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XR KRITIS Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-image: url('https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=1920'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #fff; 
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); 
            z-index: -1;
        }

        .panel-card { 
            width: 90%; 
            max-width: 380px; 
            padding: 40px 25px; 
            border-radius: 30px; 
            text-align: center; 
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* TEMA 1: HALAMAN UTAMA (Main Theme) */
        .panel-main-active {
            background-color: rgba(20, 20, 25, 0.9);
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* TEMA 2: PANEL MENU (Panel Theme) */
        .panel-menu-active {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #00c6ff;
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.3);
        }

        .lock-icon { font-size: 50px; color: #26c6da; margin-bottom: 10px; }
        h1 { font-size: 24px; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { font-size: 12px; color: #888; margin-bottom: 30px; letter-spacing: 3px; text-transform: uppercase; }

        .btn { display: block; width: 100%; padding: 15px; margin: 12px 0; border-radius: 50px; text-decoration: none; color: white; font-weight: 600; border: none; cursor: pointer; transition: transform 0.2s; font-size: 16px; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-panel { background: linear-gradient(90deg, #00c6ff, #0072ff); margin-top: 20px; }
        .btn-download { background: linear-gradient(90deg, #28a745, #20c997); }

        .divider { margin: 25px 0; font-size: 10px; color: #444; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #333; }

        input[type="password"] { width: 100%; padding: 15px; margin: 10px 0; border-radius: 50px; border: 1px solid #333; background: #1a1a1f; color: white; text-align: center; font-size: 16px; }
        .error-text { color: #ff4d4d; font-size: 12px; margin-top: 10px; display: none; }
        
        .hidden { display: none; }
    </style>
</head>
<body onload="document.getElementById('card').classList.add('panel-main-active')">

    <div class="panel-card" id="card">
        <div class="lock-icon">🌐</div>
        <h1>Proxy Monz</h1>
        <p class="subtitle" id="subtitle-text">PANEL PROXY</p>

        <div id="main-view">
            <button class="btn btn-panel" onclick="showLogin()">> Download PANEL Proxy</button>
        </div>

        <div id="login-view" class="hidden">
            <input type="password" id="password-input" placeholder="Masukkan Password">
            <button class="btn btn-panel" onclick="verifyPassword()">MASUK</button>
            <p id="error-msg" class="error-text">Password salah!</p>
        </div>

        <div id="panel-view" class="hidden">
            <div class="divider">Menu Proxy</div>
            <a href="https://www.mediafire.com/file/6r89attjkb7lfai/Monz_Proxy.zip/file" target="_blank" class="btn btn-download"> Download Proxy Monz</a>
            <button class="btn" style="background-color: #333;" onclick="location.reload()">KEMBALI</button>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
        }

        function verifyPassword() {
            const passwordBenar = "Monz V1"; 
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            const card = document.getElementById('card');
            const loginView = document.getElementById('login-view');
            const panelView = document.getElementById('panel-view');
            const subtitle = document.getElementById('subtitle-text');

            if (input === passwordBenar) {
                // Sembunyikan login, tampilkan panel
                loginView.style.display = 'none';
                panelView.style.display = 'block';
                subtitle.innerText = "PANEL MONZ";
                
                // Ganti tema kartu
                card.classList.remove('panel-main-active');
                card.classList.add('panel-menu-active');
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
