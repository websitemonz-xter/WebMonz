<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Monz - Login Only</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html { height: -webkit-fill-available; }
        body { 
            background: url('https://cdn.phototourl.com/free/2026-06-27-6a6abf78-5e7c-4da4-a543-6cddb9e4706a.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh; min-height: -webkit-fill-available;
            display: flex; justify-content: center; align-items: center; 
            color: white; padding: 40px 0;
            -webkit-text-size-adjust: 100%; touch-action: manipulation;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1; }
        .container {
            width: 90%; max-width: 400px; padding: 25px; text-align: center;
            position: relative; z-index: 2; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .auth-box h3 { margin-bottom: 15px; font-weight: 600; font-size: 20px; }
        .input-group { position: relative; margin-bottom: 15px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: rgba(255,255,255,0.6); }
        .input-group input {
            width: 100%; padding: 12px 12px 12px 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: white; outline: none; font-size: 14px;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: #1abc9c; border: none;
            border-radius: 12px; color: white; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: 0.3s;
        }
        .auth-btn:hover { background: #16a085; }
        .notif-msg { font-size: 13px; margin-top: 12px; padding: 8px; border-radius: 8px; display: none; }
        .notif-gagal { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
        .notif-sukses { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }

        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .nav-menu { display: flex; gap: 10px; }
        .nav-menu button { color: white; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; }
        .nav-menu button.aktif { background: #1abc9c; border-color: #1abc9c; font-weight: 600; }
        .logout-top-btn { width: 38px; height: 38px; background: rgba(231, 76, 60, 0.2); border: 1px solid rgba(231, 76, 60, 0.4); border-radius: 10px; color: #ff7675; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .logo-top { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.4); margin-bottom: 15px; }
        .isi-menu { display: none; }
        .muncul { display: block; }
        .option-btn { background: rgba(255, 255, 255, 0.1); padding: 15px; margin-bottom: 15px; border-radius: 15px; display: flex; align-items: center; gap: 15px; text-decoration: none; color: white; border: 1px solid rgba(255, 255, 255, 0.2); }
        .icon { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 20px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <!-- ================= HALAMAN LOGIN ================= -->
        <div id="loginPage" class="auth-box">
            <img src="https://cdn.phototourl.com/free/2026-06-27-adaed56d-30ce-42e0-b035-1512a456bb6b.jpg" alt="Logo" class="logo-top">
            <h3>Login ke Web Monz</h3>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="loginUser" placeholder="Username">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPass" placeholder="Password">
            </div>
            <button class="auth-btn" onclick="prosesLogin()">Masuk</button>
            <div id="loginNotif" class="notif-msg"></div>
        </div>

        <!-- ================= HALAMAN UTAMA ================= -->
        <div id="mainWeb" style="display: none;">
            <div class="header-nav">
                <div class="nav-menu">
                    <button id="btn1" class="aktif" onclick="pindahMenu('menu1', 'btn1')">Menu 1</button>
                    <button id="btn2" onclick="pindahMenu('menu2', 'btn2')">Menu 2</button>
                </div>
                <div class="logout-top-btn" onclick="prosesLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>
            </div>

            <img src="https://cdn.phototourl.com/free/2026-06-27-adaed56d-30ce-42e0-b035-1512a456bb6b.jpg" alt="Logo" class="logo-top">

            <div id="menu1" class="isi-menu muncul">
                <h2 style="margin-bottom: 5px;">Selamat datang di Web Monz</h2>
                <a href="https://chat.whatsapp.com/LuFfC6RKvUj25azyploexs" class="option-btn">
                    <div class="icon" style="background: #25D366;"><i class="fa-brands fa-whatsapp"></i></div>
                    <div style="text-align: left;"><h4>Grup</h4><p style="font-size: 12px; opacity: 0.8;">Link Grup Bot WhatsApp</p></div>
                </a>
                <a href="https://wa.me/6285199619115" class="option-btn">
                    <div class="icon" style="background: #00b4d8;"><i class="fa-solid fa-user-shield"></i></div>
                    <div style="text-align: left;"><h4>Owner</h4><p style="font-size: 12px; opacity: 0.8;">Hubungi nomor Owner</p></div>
                </a>
                <a href="https://www.tiktok.com/@monzz_2013?_r=1&_t=ZS-97a2g9c4s2X" class="option-btn">
                    <div class="icon" style="background: #010101; border: 1px solid rgba(255,255,255,0.3);"><i class="fa-brands fa-tiktok"></i></div>
                    <div style="text-align: left;"><h4>TikTok</h4><p style="font-size: 12px; opacity: 0.8;">Kunjungi akun Tiktok</p></div>
                </a>
            </div>

            <div id="menu2" class="isi-menu">
                <h2 style="margin-bottom: 5px;">Download & Tutorial</h2>
                <a href="https://github.com/nazedev/hitori" class="option-btn">
                    <div class="icon" style="background: #24292e;"><i class="fa-brands fa-github"></i></div>
                    <div style="text-align: left;"><h4>SC NYA</h4><p style="font-size: 12px; opacity: 0.8;">DOWNLOAD SC</p></div>
                </a>
                <a href="https://youtu.be/9FAcmYG9sbk?si=GkM_wYusI2Vs7vwG" class="option-btn">
                    <div class="icon" style="background: #FF0000;"><i class="fa-solid fa-play"></i></div>
                    <div style="text-align: left;"><h4>Video</h4><p style="font-size: 12px; opacity: 0.8;">Video tutorial</p></div>
                </a>
                <a href="https://websitemonz-xter.github.io/Menu-Bug/BugMenu" class="option-btn">
                    <div class="icon" style="background: #00ff66; color: #000000;"><i class="fa-solid fa-user-secret"></i></div>
                    <div style="text-align: left;"><h4>Menu Bug</h4><p style="font-size: 12px; opacity: 0.8;">Lihat list atau sistem bug</p></div>
                </a>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://web-monz-default-rtdb.asia-southeast1.firebasedatabase.app/";

        window.onload = function() {
            if (localStorage.getItem('monz_sedang_login') === 'true') {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainWeb').style.display = 'block';
            }
        };

        function prosesLogin() {
            var user = document.getElementById('loginUser').value.trim();
            var pass = document.getElementById('loginPass').value.trim();
            var notifBox = document.getElementById('loginNotif');

            if(user === "" || pass === "") {
                notifBox.className = "notif-msg notif-gagal";
                notifBox.innerHTML = "Username/Password tidak boleh kosong!";
                notifBox.style.display = "block";
                return;
            }

            var cleanUser = user.replace(/[.#$[\]]/g, "");

            fetch(`${FIREBASE_URL}users/${cleanUser}.json`)
            .then(res => res.json())
            .then(data => {
                if (data && data.password === pass) {
                    localStorage.setItem('monz_sedang_login', 'true');
                    location.reload();
                } else {
                    notifBox.className = "notif-msg notif-gagal";
                    notifBox.innerHTML = "Username atau Password salah!";
                    notifBox.style.display = "block";
                }
            })
            .catch(() => {
                notifBox.className = "notif-msg notif-gagal";
                notifBox.innerHTML = "Gagal menyambungkan ke server!";
                notifBox.style.display = "block";
            });
        }

        function prosesLogout() {
            localStorage.removeItem('monz_sedang_login');
            location.reload();
        }

        function pindahMenu(menuId, btnId) {
            document.querySelectorAll('.isi-menu').forEach(el => el.classList.remove('muncul'));
            document.getElementById(menuId).classList.add('muncul');
            document.querySelectorAll('.nav-menu button').forEach(el => el.classList.remove('aktif'));
            document.getElementById(btnId).classList.add('aktif');
        }
    </script>
</body>
</html>
